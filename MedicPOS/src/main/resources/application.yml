spring:
  application:
    name: farmamed

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/farmamed?currentSchema=farmamed,public}
    username: ${DATABASE_USERNAME:farmamed_app}
    password: ${DATABASE_PASSWORD:farmamed_dev_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: farmamed
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  security:
    jwt:
      secret: ${JWT_SECRET:FarmaMedSecretKeyForJWTTokenGenerationHospitalSantaMaria2026}
      expiration: 86400000 # 24 horas en milisegundos

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

farmamed:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}

  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_RPM:5}

factiliza:
  base-url: ${FACTILIZA_BASE_URL:https://api.factiliza.com}
  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0MjYxOCJ9.dMhTEx_V7iqhmCKI3tVsQcG3y9EzmExiPD0hkkdY-K0
  timeout-ms: ${FACTILIZA_TIMEOUT_MS:5000}
  connect-timeout-ms: ${FACTILIZA_CONNECT_TIMEOUT_MS:3000}
  mock-enabled: ${FACTILIZA_MOCK_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.medicalstore: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
